[package]
name = "clipper"
version = "1.2.0"
edition = "2024"

[dependencies]
global-hotkey = "0.9.0"
nnnoiseless = { version = "0.5.2", default-features = false }
rfd = { version = "0.18.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = "3.5.1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
zune-jpeg = "0.5"
wasapi = "0.27.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Etw", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Time", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_Devices_Display", "Win32_System_Diagnostics_ToolHelp", "Win32_Media", "Win32_Media_Audio", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"


